name: Verify cloudberry#2091 (PAX IS NULL after DELETE)

# Scratch runtime verification ONLY. Builds apache/cloudberry@main with
# assertions, runs the issue #2091 reproducer BEFORE the fix, applies the
# fix, rebuilds contrib/pax_storage, restarts the cluster, and runs the
# reproducer AFTER the fix. Uploads before/after logs as artifacts.
# This workflow never commits to or opens a PR against apache/cloudberry.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-2091-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    container:
      image: apache/incubator-cloudberry:cbdb-build-rocky9-latest
      options: >-
        --privileged
        --user root
        --hostname cdw
        --shm-size=2gb
        --ulimit core=0
        -v /usr/share:/host_usr_share
        -v /usr/local:/host_usr_local
        -v /opt:/host_opt

    steps:
    - name: Free Disk Space
      run: |
        df -h /
        rm -rf /host_opt/hostedtoolcache || true
        rm -rf /host_usr_local/lib/android || true
        rm -rf /host_usr_share/dotnet || true
        rm -rf /host_opt/ghc || true
        rm -rf /host_usr_local/.ghcup || true
        rm -rf /host_usr_share/swift || true
        rm -rf /host_usr_local/share/powershell || true
        rm -rf /host_usr_local/share/chromium || true
        rm -rf /host_usr_share/miniconda || true
        rm -rf /host_opt/az || true
        rm -rf /host_usr_share/sbt || true
        df -h /

    - name: Checkout apache/cloudberry (main)
      uses: actions/checkout@v4
      with:
        repository: apache/cloudberry
        ref: main
        path: cloudberry
        submodules: true
        fetch-depth: 1

    - name: Checkout verification tools (this repo)
      uses: actions/checkout@v4
      with:
        path: tools

    - name: Resolve parameters
      run: |
        set -euo pipefail
        sha=$(git -C cloudberry rev-parse HEAD)
        {
          echo "SRC_DIR=${GITHUB_WORKSPACE}/cloudberry"
          echo "TOOLS_DIR=${GITHUB_WORKSPACE}/tools"
          echo "RESULTS_DIR=${GITHUB_WORKSPACE}/results"
          echo "CLOUDBERRY_SHA=${sha}"
        } | tee -a "$GITHUB_ENV"
        echo "cloudberry main commit: ${sha}"
        printf '%s\n' "${sha}" > "${GITHUB_WORKSPACE}/cloudberry-sha.txt"

    - name: Cloudberry Environment Initialization
      run: |
        set -eo pipefail
        if ! su - gpadmin -c "/tmp/init_system.sh"; then
          echo "::error::Container initialization failed"; exit 1
        fi
        mkdir -p "${RESULTS_DIR}" cloudberry/build-logs
        chown -R gpadmin:gpadmin .
        chmod -R 755 .
        df -h /
        free -h

    - name: Configure (assertions on)
      run: |
        set -eo pipefail
        if ! time su - gpadmin -c "cd ${SRC_DIR} && SRC_DIR=${SRC_DIR} ENABLE_DEBUG=true ${SRC_DIR}/devops/build/automation/cloudberry/scripts/configure-cloudberry.sh"; then
          echo "::error::Configure failed"; exit 1
        fi

    - name: Build (full, unpatched main)
      run: |
        set -eo pipefail
        if ! time su - gpadmin -c "cd ${SRC_DIR} && SRC_DIR=${SRC_DIR} ${SRC_DIR}/devops/build/automation/cloudberry/scripts/build-cloudberry.sh"; then
          echo "::error::Build failed"; exit 1
        fi

    - name: Create demo cluster (no mirrors)
      run: |
        set -eo pipefail
        if ! time su - gpadmin -c "cd ${SRC_DIR} && WITH_MIRRORS=false BLDWRAP_POSTGRES_CONF_ADDONS=log_statement=none SRC_DIR=${SRC_DIR} ${SRC_DIR}/devops/build/automation/cloudberry/scripts/create-cloudberry-demo-cluster.sh"; then
          echo "::error::Cluster creation failed"; exit 1
        fi

    - name: BEFORE fix - run reproducer
      run: |
        set -eo pipefail
        su - gpadmin -c "SRC_DIR=${SRC_DIR} TOOLS_DIR=${TOOLS_DIR} bash ${TOOLS_DIR}/run-repro.sh repro.sql rb_before ${RESULTS_DIR}/before_repro.log"
        su - gpadmin -c "SRC_DIR=${SRC_DIR} TOOLS_DIR=${TOOLS_DIR} bash ${TOOLS_DIR}/run-repro.sh check.sql cb_before ${RESULTS_DIR}/before_check.log"

    - name: Install PAX regress harness deps
      run: |
        set -eo pipefail
        su - gpadmin -c "cd ${SRC_DIR} && make -j\$(nproc) -C src/test/regress && make -C gpcontrib/gp_inject_fault install"

    - name: Add #2091 regression test (test-only, no code fix yet)
      run: |
        set -eo pipefail
        su - gpadmin -c "cd ${SRC_DIR} && git config --global --add safe.directory ${SRC_DIR} && git apply --verbose --include='contrib/pax_storage/sql/delete_null_stats.sql' --include='contrib/pax_storage/expected/delete_null_stats.out' --include='contrib/pax_storage/pax_schedule' ${TOOLS_DIR}/fix.patch && echo '=== schedule now ===' && grep -n delete_null_stats contrib/pax_storage/pax_schedule"

    - name: PAX suite BASELINE (unpatched code, new test present)
      run: |
        set -uo pipefail
        su - gpadmin -c "source /usr/local/cloudberry-db/cloudberry-env.sh && source ${SRC_DIR}/gpAux/gpdemo/gpdemo-env.sh && cd ${SRC_DIR}/contrib/pax_storage && make pax-test" > "${RESULTS_DIR}/pax_suite_baseline.log" 2>&1 || true
        su - gpadmin -c "cd ${SRC_DIR}/contrib/pax_storage && cp -f regression.diffs ${RESULTS_DIR}/pax_suite_baseline.diffs 2>/dev/null; mkdir -p ${RESULTS_DIR}/baseline_results && cp -f results/*.out ${RESULTS_DIR}/baseline_results/ 2>/dev/null; true"
        echo "=== baseline tail ==="; tail -n 40 "${RESULTS_DIR}/pax_suite_baseline.log" || true
        echo "=== baseline FAILED tests ==="; grep -E 'FAILED' "${RESULTS_DIR}/pax_suite_baseline.log" || true

    - name: Apply code fix to contrib/pax_storage
      run: |
        set -eo pipefail
        su - gpadmin -c "cd ${SRC_DIR} && git apply --verbose --include='contrib/pax_storage/src/cpp/storage/pax.cc' ${TOOLS_DIR}/fix.patch && echo '=== applied region ===' && sed -n '605,640p' contrib/pax_storage/src/cpp/storage/pax.cc"

    - name: Rebuild contrib/pax_storage only (fast)
      run: |
        set -eo pipefail
        if ! time su - gpadmin -c "cd ${SRC_DIR} && SRC_DIR=${SRC_DIR} make -j\$(nproc) -C ${SRC_DIR}/contrib/pax_storage && make -C ${SRC_DIR}/contrib/pax_storage install"; then
          echo "::error::pax_storage rebuild failed"; exit 1
        fi

    - name: Restart cluster to load rebuilt pax.so
      run: |
        set -eo pipefail
        su - gpadmin -c "source /usr/local/cloudberry-db/cloudberry-env.sh && source ${SRC_DIR}/gpAux/gpdemo/gpdemo-env.sh && gpstop -a -M fast && gpstart -a && gpstate"

    - name: AFTER fix - run reproducer
      run: |
        set -eo pipefail
        su - gpadmin -c "SRC_DIR=${SRC_DIR} TOOLS_DIR=${TOOLS_DIR} bash ${TOOLS_DIR}/run-repro.sh repro.sql ra_after ${RESULTS_DIR}/after_repro.log"
        su - gpadmin -c "SRC_DIR=${SRC_DIR} TOOLS_DIR=${TOOLS_DIR} bash ${TOOLS_DIR}/run-repro.sh check.sql ca_after ${RESULTS_DIR}/after_check.log"

    - name: PAX suite PATCHED (code fix applied)
      run: |
        set -uo pipefail
        su - gpadmin -c "source /usr/local/cloudberry-db/cloudberry-env.sh && source ${SRC_DIR}/gpAux/gpdemo/gpdemo-env.sh && cd ${SRC_DIR}/contrib/pax_storage && make pax-test" > "${RESULTS_DIR}/pax_suite_patched.log" 2>&1 || true
        su - gpadmin -c "cd ${SRC_DIR}/contrib/pax_storage && cp -f regression.diffs ${RESULTS_DIR}/pax_suite_patched.diffs 2>/dev/null; mkdir -p ${RESULTS_DIR}/patched_results && cp -f results/*.out ${RESULTS_DIR}/patched_results/ 2>/dev/null; true"
        echo "=== patched tail ==="; tail -n 40 "${RESULTS_DIR}/pax_suite_patched.log" || true
        echo "=== patched FAILED tests ==="; grep -E 'FAILED' "${RESULTS_DIR}/pax_suite_patched.log" || true

    - name: Assert PAX suite no-regression
      run: |
        set -uo pipefail
        cd "${RESULTS_DIR}"
        # Extract failed test names from pg_regress "test <name> ... FAILED" lines.
        grep -E '\.\.\. FAILED' pax_suite_baseline.log | sed -E 's/^test +([^ ]+).*/\1/' | sort -u > baseline_failed.txt || true
        grep -E '\.\.\. FAILED' pax_suite_patched.log  | sed -E 's/^test +([^ ]+).*/\1/' | sort -u > patched_failed.txt || true
        echo "=== baseline failed ==="; cat baseline_failed.txt
        echo "=== patched failed ==="; cat patched_failed.txt
        ok=1
        if ! grep -qx delete_null_stats baseline_failed.txt; then
          echo "::error::New test delete_null_stats did NOT fail on unpatched code (expected to reproduce #2091)."; ok=0
        fi
        if grep -qx delete_null_stats patched_failed.txt; then
          echo "::error::delete_null_stats still fails after fix."; ok=0
        fi
        # No new failures introduced by the fix.
        while read -r t; do
          [ -z "$t" ] && continue
          if ! grep -qx "$t" baseline_failed.txt; then
            echo "::error::New regression in PAX suite after fix: $t"; ok=0
          fi
        done < patched_failed.txt
        {
          echo "## PAX regression suite (pax_schedule)"
          echo "- baseline (unpatched) failed: $(tr '\n' ' ' < baseline_failed.txt)"
          echo "- patched failed: $(tr '\n' ' ' < patched_failed.txt)"
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "$ok" = "1" ]; then
          echo "PASS: delete_null_stats reproduces #2091 before fix, passes after, no new suite regressions." | tee -a "$GITHUB_STEP_SUMMARY"
        else
          echo "FAIL: PAX suite no-regression assertion failed." >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

    - name: Assert before/after contrast
      run: |
        set -uo pipefail
        cd "${RESULTS_DIR}"
        echo "=== BEFORE (sparse on) ==="; grep sparse_on_isnull_count before_check.log || true
        echo "=== AFTER  (sparse on) ==="; grep sparse_on_isnull_count after_check.log || true
        b=$(grep 'sparse_on_isnull_count *|' before_check.log | grep -Eo '[0-9]+' | head -1)
        a=$(grep 'sparse_on_isnull_count *|' after_check.log | grep -Eo '[0-9]+' | head -1)
        echo "before_count='${b}' after_count='${a}'"
        {
          echo "# cloudberry#2091 runtime verification"
          echo
          echo "- apache/cloudberry main commit: $(cat ${GITHUB_WORKSPACE}/cloudberry-sha.txt)"
          echo "- debug build with assertions, demo cluster without mirrors"
          echo
          echo "| phase | WHERE c0 IS NULL (sparse on) | expected |"
          echo "|---|---|---|"
          echo "| BEFORE fix | ${b} | 0 (bug) |"
          echo "| AFTER fix  | ${a} | 2 (fixed) |"
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "${b}" = "0" ] && [ "${a}" = "2" ]; then
          echo "PASS: bug reproduced before fix (0) and gone after fix (2)." | tee -a "$GITHUB_STEP_SUMMARY"
        else
          echo "::error::Contrast not as expected (before='${b}', after='${a}'). See logs."
          echo "FAIL: before='${b}' after='${a}'" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

    - name: Upload logs
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: verify-2091-logs
        path: |
          results/
          cloudberry/build-logs/
          cloudberry-sha.txt
        retention-days: 30